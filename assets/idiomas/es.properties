rasgo.TRUCO.desc=Potencia puntos/multiplicador de Truco, combate o victoria de mano.
rasgo.TRUCO.tier1=+0,25 al canto de Truco en cada ronda
rasgo.TRUCO.tier2=+1 al canto de Truco en cada ronda
rasgo.TRUCO.tier3=x1.5 al canto de Truco en cada ronda

rasgo.ENVIDO.desc=Puntaje, multiplicador o resultado de Envido.
rasgo.ENVIDO.tier1=+0,25 al canto de Envido en cada ronda
rasgo.ENVIDO.tier2=+1 al canto de Envido en cada ronda
rasgo.ENVIDO.tier3=x1.5 al canto de Envido en cada ronda

rasgo.ACTIVACION.desc=Reactivaciones, disparadores, copias o cambios que dependen de activar cartas.
rasgo.ACTIVACION.tier1=+1 reactivacion a la primera carta activa
rasgo.ACTIVACION.tier2=+2 reactivaciones a la primera carta activa
rasgo.ACTIVACION.tier3=+3 reactivaciones a la primera carta activa

rasgo.MAZO.desc=Mano, mazo, descartes, agregar/copiar/consumir cartas.
rasgo.MAZO.tier1=+1 descarte por ronda
rasgo.MAZO.tier2=+1 tamaño de mano
rasgo.MAZO.tier3=+1 tamaño de mano, +1 descarte

rasgo.ECONOMIA.desc=Pesos, deuda, tienda, rerolls, compras, ventas y recompensas.
rasgo.ECONOMIA.tier1=+$2 al derrotar un rival
rasgo.ECONOMIA.tier2=+2 al tope de interes
rasgo.ECONOMIA.tier3=+$3 al derrotar un rival, +2 al tope de interes

rasgo.CONSUMIBLES.desc=Obtencion, consumo, espacios y amplificacion de Santos/consumibles. (actual: +{0} puntos)
rasgo.CONSUMIBLES.tier1=+1 espacio de consumible
rasgo.CONSUMIBLES.tier2=+1 espacio de consumible, +25 puntos por cada consumible usado en el combate
rasgo.CONSUMIBLES.tier3=+2 espacios de consumible, +50 puntos por cada consumible usado en el combate

rasgo.GASTRONOMIA.desc=Sabores, comidas y banquetes de la mesa de truco.
rasgo.GASTRONOMIA.tier1=+0,25 al canto de Truco en cada ronda
rasgo.GASTRONOMIA.tier2=+1 al canto de Truco en cada ronda
rasgo.GASTRONOMIA.tier3=x1.5 al canto de Truco en cada ronda

rasgo.BEBIDA.desc=Otorga puntos de Truco por cada joker que tengas en mano.
rasgo.BEBIDA.tier1=+10 puntos por cada joker
rasgo.BEBIDA.tier2=+50 puntos por cada joker
rasgo.BEBIDA.tier3=+100 puntos por cada joker

rasgo.FAUNA.desc=Otorga puntos de Envido por cada joker que tengas en mano.
rasgo.FAUNA.tier1=+10 puntos por cada joker
rasgo.FAUNA.tier2=+50 puntos por cada joker
rasgo.FAUNA.tier3=+100 puntos por cada joker

rasgo.TERRITORIO.desc=Provincias, regiones y fronteras del pais.
rasgo.TERRITORIO.tier1=+0,25 al canto de Envido en cada ronda
rasgo.TERRITORIO.tier2=+1 al canto de Envido en cada ronda
rasgo.TERRITORIO.tier3=x1.5 al canto de Envido en cada ronda

rasgo.NACIONAL.desc=Orgullo, simbolos e idolos de la patria.
rasgo.NACIONAL.tier1=+$2 al derrotar al rival
rasgo.NACIONAL.tier2=+1 espacio de jokers
rasgo.NACIONAL.tier3=+1 espacio de jokers, +1 tamaño de mano
rasgo.NACIONAL.tier4=+1 espacio de jokers, +1 tamaño de mano. Aparece el legendario CarpinchoGauchoMatero

rasgo.PERSONA.desc=Otorga multiplicador por cada joker no Persona vendido. (actual: +{0} mult)
rasgo.PERSONA.tier1=+2 multiplicador por joker vendido
rasgo.PERSONA.tier2=+5 multiplicador por joker vendido
rasgo.PERSONA.tier3=+10 multiplicador por joker vendido

rasgo.CULTURA.desc=Arte, tradicion, patrimonio y expresiones culturales. (acumulado: +{0} puntos, +{1} mult de Truco)
rasgo.CULTURA.tier1=+10 puntos permanentes al comprar un joker
rasgo.CULTURA.tier2=+1 mult de Truco y +10 puntos permanentes al comprar un joker. Si es de Cultura, el doble

rasgo.OBJETO.desc=Objetos o artefactos reconocibles por nombre/efecto.
rasgo.OBJETO.tier1=+1 espacio de consumibles
rasgo.OBJETO.tier2=+1 espacio de consumibles, x2 multiplicador si todos los espacios de consumibles estan ocupados

rasgo.RACHAS.desc=Otorga bonificaciones segun la racha de victorias de Truco. (actual: +{0} mult, +${1})
rasgo.RACHAS.tier1=+1 mult de Truco por victoria de la racha
rasgo.RACHAS.tier2=+2 mult de Truco por victoria de la racha
rasgo.RACHAS.tier3=+3 mult de Truco por victoria de la racha, +$1 por victoria de la racha al derrotar al rival

rasgo.FIGURA.desc=Otorga bonificaciones segun la cantidad de cartas figura en tu mazo. (actual: {0} figuras)
rasgo.FIGURA.tier1=+5 puntos por figura
rasgo.FIGURA.tier2=+10 puntos por figura
rasgo.FIGURA.tier3=+15 puntos y +2 multiplicador por figura

rasgo.AZAR.desc=Efectos aleatorios, probabilisticos o de resultado variable. (probabilidad actual: {0}%)
rasgo.AZAR.tier1=Cada mano ganada: 50% de +4 mult de Truco, o 50% de +$2
rasgo.AZAR.tier2=25% de x2 al mult de Truco. Cada fallo suma 10% de probabilidad hasta que sale

rasgo.DEPORTE.desc=Deportes y espacios deportivos. (manos ganadas: {0})
rasgo.DEPORTE.tier1=+1 multiplicador de Envido por cada mano ganada

rasgo.TRANSPORTE.desc=Medios de transporte nombrados.
rasgo.TRANSPORTE.tier1=+1 espacio de jokers, cartas y santos en la tienda

